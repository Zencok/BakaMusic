[package]
name = "baka-plugin-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[workspace]
resolver = "3"
members = ["rust/crates/baka-core", "rust/crates/baka-logging", "rust/crates/baka-plugin-host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
baka-core = { path = "rust/crates/baka-core" }
baka-logging = { path = "rust/crates/baka-logging" }
baka-plugin-host = { path = "rust/crates/baka-plugin-host" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }

[patch.crates-io]
rquickjs-sys = { path = "rust/vendor/rquickjs-sys" }

[dependencies]
baka-core.workspace = true
baka-logging.workspace = true
baka-plugin-host.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 1
